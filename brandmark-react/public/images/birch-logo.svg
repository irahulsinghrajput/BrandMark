<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <!-- Birch Leaf / Organic Branch Monogram Icon -->
  <g transform="translate(18, 14)">
    <!-- Elegant Botanical Leaf Circle Accent -->
    <circle cx="26" cy="26" r="24" fill="#0B2C4D" fill-opacity="0.06" stroke="#0B2C4D" stroke-width="1.5" stroke-dasharray="2 3"/>
    <!-- Organic Branch / Birch Leaf Stem -->
    <path d="M 16 38 C 20 28, 28 20, 36 14" stroke="#D9531E" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Leaf 1 -->
    <path d="M 23 29 C 21 23, 26 19, 31 21 C 32 26, 27 30, 23 29 Z" fill="#0B2C4D"/>
    <!-- Leaf 2 -->
    <path d="M 28 21 C 29 15, 35 13, 38 17 C 37 22, 31 24, 28 21 Z" fill="#D9531E"/>
    <!-- Leaf 3 -->
    <path d="M 18 35 C 14 31, 16 25, 21 26 C 22 31, 19 36, 18 35 Z" fill="#0B2C4D" fill-opacity="0.8"/>
  </g>

  <!-- Typography: BIRCH PATNA -->
  <g transform="translate(78, 22)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="24" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="800" letter-spacing="4" fill="#0B2C4D">
      BIRCH
    </text>
    <!-- Secondary Location & Tagline -->
    <text x="1" y="39" font-family="'Outfit', -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2.5" fill="#D9531E">
      PATNA • RESTRO &amp; CAFE
    </text>
  </g>
</svg>
