version: '3.8'

services:
  # BM-OS React Frontend
  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  # BM-OS Express/Node Backend (Middleware for Webhooks)
  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - deployment/.env.production
    restart: always

  # n8n Orchestration Engine (Self-Hosted)
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: always

volumes:
  n8n_data:
